name: CI

on:
  push:
    branches:
      - main
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Lint package and build script
        run: ruff check setup.py src

  test:
    name: Build and test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall -e ".[test]"

      - name: Run tests
        run: python -m unittest discover -s test -v

  build-distribution:
    name: Build distribution
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build-distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turbo-hce
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: python-distribution
          path: dist

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
