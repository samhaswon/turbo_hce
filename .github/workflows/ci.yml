name: CI

on:
  push:
    branches:
      - main
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Lint package and build script
        run: ruff check build_helpers.py setup.py src

  test:
    name: Build and test (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall -e ".[test]"

      - name: Run tests
        run: python -m unittest discover -s test -v

  build-manylinux-distribution:
    name: Build manylinux distribution
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build and validate manylinux distributions
        run: |
          docker run --rm \
            -e PLAT=manylinux_2_28_x86_64 \
            -v "${{ github.workspace }}:/io" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            /bin/bash -ec '
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              python -m pip install --upgrade build auditwheel cmake twine
              python -m build --sdist --outdir /io/dist
              python -m build --wheel --outdir /io/wheelhouse
              auditwheel repair --plat "$PLAT" --wheel-dir /io/dist /io/wheelhouse/*.whl
              python -m twine check /io/dist/*
            '

      - name: Upload distribution
        uses: actions/upload-artifact@v6
        with:
          name: python-manylinux-distribution
          path: dist/*
          if-no-files-found: error

  build-windows-distribution:
    name: Build Windows distribution
    if: github.event_name == 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build and validate Windows wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --outdir dist
          Get-ChildItem dist/*.whl | ForEach-Object {
            python -m twine check $_.FullName
          }

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v6
        with:
          name: python-windows-distribution
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs:
      - build-manylinux-distribution
      - build-windows-distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/turbo-hce
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v7
        with:
          name: python-manylinux-distribution
          path: dist

      - name: Download Windows wheel
        uses: actions/download-artifact@v7
        with:
          name: python-windows-distribution
          path: dist

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
