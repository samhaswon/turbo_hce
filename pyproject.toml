[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo_hce"
dynamic = ["version"]
description = "Fast C/C++ extension for Human Correction Effort (HCE) metric"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Samuel", email = "sahoward42@tntech.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
test = [
    "onnxruntime",
    "opencv-python",
    "pillow",
    "scikit-image",
    "tqdm",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
version = {attr = "turbo_hce.__version__"}
